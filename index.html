<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBEEE3">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>삐약 매매일지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: one phone-width column on a peach ground, soft grey panels like a companion app, fixed bottom tab bar */
:root{
  --bg:#FBEEE3; --paper:#FCFAF9; --panel:#EFEDF0; --line:#E5DFE1;
  --ink:#4D4A52; --ink-soft:#8E8992; --rose:#C04B61; --rose-soft:#F8DEE3;
  --peach:#E88A6C; --peach-soft:#FDE5D9; --sky:#DCEAF7; --sky-ink:#4A7BAA;
  --good:#3E8E6A; --good-soft:#D9F0E4; --warn:#A86B12; --warn-soft:#FFF0C9; --bad:#C2413B; --bad-soft:#FBE1DE;
  --chick:#FFE68E; --chick-line:#86603F; --beak:#F4A25E; --blush:#F7A9B5;
  --shadow:0 6px 18px rgba(150,110,90,.12);
  --f-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"Nunito","Gowun Dodum","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#272224; --paper:#332D30; --panel:#3D373A; --line:#4A4346;
  --ink:#F2ECEE; --ink-soft:#B5ACB1; --rose:#F29AAB; --rose-soft:#4D3239;
  --peach:#F2A68C; --peach-soft:#4A362F; --sky:#2F3E4E; --sky-ink:#9CC3EA;
  --good:#7FD1A8; --good-soft:#244034; --warn:#F2C46B; --warn-soft:#45391F; --bad:#F59A94; --bad-soft:#4A2826;
  --chick:#FFE07A; --chick-line:#6B4A30; --beak:#F4A25E; --blush:#E98C9C;
  --shadow:0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#272224; --paper:#332D30; --panel:#3D373A; --line:#4A4346;
  --ink:#F2ECEE; --ink-soft:#B5ACB1; --rose:#F29AAB; --rose-soft:#4D3239;
  --peach:#F2A68C; --peach-soft:#4A362F; --sky:#2F3E4E; --sky-ink:#9CC3EA;
  --good:#7FD1A8; --good-soft:#244034; --warn:#F2C46B; --warn-soft:#45391F; --bad:#F59A94; --bad-soft:#4A2826;
  --chick:#FFE07A; --chick-line:#6B4A30; --beak:#F4A25E; --blush:#E98C9C;
  --shadow:0 6px 18px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px;display:flex;flex-direction:column;gap:18px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
svg.chick{flex:none;display:block}

/* header */
.top{display:flex;align-items:center;gap:12px}
.top h1{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;color:var(--ink);letter-spacing:.5px}
.top .sub{color:var(--ink-soft);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnums label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .grow{flex:1;min-width:0}
.save{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.save.busy i{background:var(--warn)} .save.err i{background:var(--bad)} .save.local i{background:var(--sky-ink)}

/* cards */
.card{background:var(--paper);border-radius:24px;box-shadow:var(--shadow);padding:18px}
.ctitle{display:flex;align-items:center;gap:10px}
.ctitle h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0}
.ctitle .hint{color:var(--ink-soft);font-size:12.5px}
.ctitle .grow{flex:1;min-width:0}
.btn{border:0;cursor:pointer;border-radius:999px;padding:9px 16px;background:var(--paper);color:var(--rose);font-weight:700;box-shadow:0 2px 8px rgba(150,110,90,.12);font-family:var(--f-display);font-size:15px;letter-spacing:.3px}
.btn:hover{background:var(--rose-soft)}
.btn.main{background:var(--rose);color:var(--paper)}
.btn.main:hover{filter:brightness(1.06);background:var(--rose)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink-soft);font-family:var(--f-body);font-size:13px;padding:6px 10px}
.btn.ghost:hover{background:var(--panel)}
.btn.small{padding:6px 12px;font-size:13.5px}
.btn.danger{color:var(--bad)}
.icon-btn{border:0;background:var(--panel);width:30px;height:30px;border-radius:50%;cursor:pointer;color:var(--ink-soft);font-size:16px;line-height:1;flex:none}
.icon-btn:hover{background:var(--rose-soft);color:var(--rose)}
:focus-visible{outline:3px solid var(--peach);outline-offset:2px}

/* principles */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.pbox{background:var(--panel);border-radius:18px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pbox.full{grid-column:1/-1}
.pbox .ph{display:flex;align-items:center;gap:8px}
.pbox .ph b{font-family:var(--f-display);font-weight:400;font-size:16px}
.pbox .ph input.lbl{flex:1;min-width:0;border:0;background:transparent;font-family:var(--f-display);font-size:16px;padding:2px 0}
.pbox .ph .grow{flex:1}
.pnums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
details.hist{margin-top:10px;background:var(--panel);border-radius:16px;padding:8px 12px}
details.hist summary{cursor:pointer;color:var(--ink-soft);font-size:13.5px}
.hrow{display:grid;grid-template-columns:150px minmax(0,1fr) 30px;gap:8px;align-items:start;margin-top:8px}

/* inputs */
.in,.ta{width:100%;border:1.5px solid transparent;background:var(--paper);border-radius:12px;padding:9px 11px;outline:none;min-width:0}
.pbox .in,.pbox .ta{background:var(--paper)}
.in:focus,.ta:focus{border-color:var(--peach)}
.in::placeholder,.ta::placeholder{color:var(--ink-soft);opacity:.75}
.ta{resize:none;overflow:hidden;line-height:1.55;min-height:44px}
.ctl{position:relative;display:flex;align-items:center}
.ctl .u{position:absolute;right:11px;color:var(--ink-soft);font-size:13px;pointer-events:none}
.ctl .in.hasu{padding-right:34px}
.in[type=date]{min-height:41px}
.kor{font-size:12px;color:var(--peach);min-height:0}
.kor:empty{display:none}
.mini{font-size:12px;color:var(--ink-soft)}

/* list view */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;cursor:pointer;border-radius:999px;padding:6px 12px;background:var(--panel);color:var(--ink-soft);font-size:13.5px}
.chip.on{background:var(--rose-soft);color:var(--rose);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--paper);border-radius:18px;padding:12px;box-shadow:var(--shadow);min-width:0}
.tile .l{font-size:12px;color:var(--ink-soft)}
.tile .v{font-size:19px;font-weight:800;margin-top:2px;overflow-wrap:anywhere}
.tile .s{font-size:11.5px;color:var(--ink-soft)}
.trades{display:flex;flex-direction:column;gap:12px}
.tcard{display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%;border:0;background:var(--paper);border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.tcard:hover{transform:translateY(-1px)}
.tcard .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.tcard .nm{font-family:var(--f-display);font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard .meta{font-size:12.5px;color:var(--ink-soft)}
.tcard .right{text-align:right;flex:none}
.tcard .big{font-size:18px;font-weight:800}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;background:var(--panel);color:var(--ink-soft);white-space:nowrap}
.pill.duo{background:var(--panel);color:var(--ink)}
.pill.duo span+span{border-left:1px solid var(--line);padding-left:6px}
.pill.hold{background:var(--good-soft);color:var(--good)}
.pill.part{background:var(--sky);color:var(--sky-ink)}
.pill.done{background:var(--panel);color:var(--ink-soft)}
.pill.draft{background:var(--peach-soft);color:var(--peach)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ex{background:var(--sky);color:var(--sky-ink)}
.up{color:var(--bad)} .down{color:var(--sky-ink)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:26px 10px}
.empty p{margin:0;color:var(--ink-soft)}
.empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* editor */
.ebar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.back{border:0;width:42px;height:42px;border-radius:14px;background:var(--paper);box-shadow:var(--shadow);cursor:pointer;font-size:22px;color:var(--ink);flex:none}
.ebar .t{flex:1;min-width:0}
.ebar .t b{font-family:var(--f-display);font-weight:400;font-size:21px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec{display:flex;flex-direction:column;gap:14px}
.sec .shead{display:flex;align-items:center;gap:10px}
.sec .shead h3{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0}
.sec .shead .grow{flex:1;min-width:0}
.sec .shead .d{font-size:12.5px;color:var(--ink-soft)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.w2{grid-column:1/-1}
.fld>label,.fld>.lab{font-size:13px;font-weight:700;color:var(--ink);display:flex;gap:6px;align-items:center}
.fld .note{font-size:12px;color:var(--ink-soft)}
.fld.filled .note{display:none}
.fields .in,.fields .ta,.lrow .in{background:var(--panel)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.rating{display:flex;gap:6px}
.rating button{border:0;background:transparent;padding:0;cursor:pointer;opacity:.3;filter:grayscale(1)}
.rating button.on{opacity:1;filter:none}
.list{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;gap:8px;align-items:start;background:var(--paper);border:1.5px dashed var(--line);border-radius:16px;padding:10px}
.lrow .c{display:flex;flex-direction:column;gap:3px;min-width:0}
.lrow .c span{font-size:11.5px;color:var(--ink-soft)}
.lrow .x{align-self:center;margin-top:14px}
.ldd{font-size:12px;font-weight:800;align-self:center;white-space:nowrap}
.calc{background:var(--panel);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.calc .ch{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cv{background:var(--paper);border-radius:14px;padding:8px 10px;min-width:0}
.cv .l{font-size:11.5px;color:var(--ink-soft)}
.cv .v{font-weight:800;font-size:16px;overflow-wrap:anywhere}
.cv .s{font-size:11px;color:var(--ink-soft)}
.cv.good .v{color:var(--good)} .cv.bad .v{color:var(--bad)} .cv.warn .v{color:var(--warn)} .cv.up .v{color:var(--bad)} .cv.down .v{color:var(--sky-ink)}
.warns{display:flex;flex-direction:column;gap:6px}
.wmsg{display:flex;gap:8px;align-items:flex-start;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:8px 10px;font-size:13px}
.wmsg.bad{background:var(--bad-soft);color:var(--bad)}
.wmsg.good{background:var(--good-soft);color:var(--good)}
.checks{display:flex;flex-direction:column;gap:6px}
.ck{display:flex;gap:10px;align-items:center;background:var(--panel);border-radius:12px;padding:8px 10px;font-size:13.5px}
.ck .mk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.ck.pass .mk{background:var(--good-soft);color:var(--good)}
.ck.fail .mk{background:var(--bad-soft);color:var(--bad)}
.ck.na .mk{background:var(--paper);color:var(--ink-soft)}
.ck.na{color:var(--ink-soft)}
.ck label{display:flex;gap:10px;align-items:center;cursor:pointer;flex:1}
.ck input{width:18px;height:18px;accent-color:var(--rose)}
.ref{font-size:12.5px;color:var(--ink-soft);background:var(--panel);border-radius:12px;padding:8px 10px;white-space:pre-wrap}
.ref b{color:var(--ink)}
.xbox{display:flex;flex-direction:column;gap:6px;background:var(--peach-soft);border-radius:16px;padding:10px}
.xbox .xh{display:flex;gap:8px;align-items:center}
.xbox .in.lbl{font-weight:700;background:var(--paper)}
.xbox .ta{background:var(--paper)}
.xact{display:flex;justify-content:flex-end;gap:8px}
.xmsg{color:var(--bad)}
.xmsg:empty{display:none}
.icon-btn.sm{width:26px;height:26px;font-size:14px}
.lab .grow,.ph .grow{flex:1}
.req{font-size:11px;background:var(--rose-soft);color:var(--rose);border-radius:999px;padding:2px 8px}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);box-shadow:0 -4px 18px rgba(150,110,90,.12);border-radius:22px 22px 0 0;padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav .in-nav{max-width:420px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nav button{border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;padding:4px;border-radius:16px;color:var(--ink-soft);font-family:var(--f-display);font-size:13px}
.nav button.on{color:var(--rose);background:var(--rose-soft)}

@media (max-width:560px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pgrid{grid-template-columns:minmax(0,1fr)}
  .fields{grid-template-columns:minmax(0,1fr)}
  .hrow{grid-template-columns:minmax(0,1fr) 30px}
  .hrow .hd{grid-column:1/-1}
  .top h1{font-size:24px}
  .save .st{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .tcard{transition:transform .15s}
  .bob{animation:bob 3.2s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-3px)}}
}
</style>

<div class="wrap" id="app"></div>
<nav class="nav" aria-label="자산 종류"><div class="in-nav" id="nav"></div></nav>

<script>
/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, a, ...kids) {
  const el = document.createElement(tag);
  if (a) for (const [k, v] of Object.entries(a)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'html') el.innerHTML = v; // only trusted SVG constants
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const num = v => {
  if (v === undefined || v === null || v === '') return NaN;
  const s = String(v).replace(/[,\s원$%]/g, '');
  if (/[억만]/.test(s)) { // "3억", "1.5억", "3억 5000만"
    const m = s.match(/^(?:([\d.]+)억)?(?:([\d.]+)만)?([\d.]+)?$/);
    return m && (m[1] || m[2] || m[3]) ? (+m[1] || 0) * 1e8 + (+m[2] || 0) * 1e4 + (+m[3] || 0) : NaN;
  }
  const n = parseFloat(s); return Number.isFinite(n) ? n : NaN;
};
const ok = n => typeof n === 'number' && Number.isFinite(n);
const fmtN = (n, d = 0) => ok(n) ? n.toLocaleString('ko-KR', { maximumFractionDigits: d }) : '—';
const won = n => ok(n) ? fmtN(Math.round(n)) + '원' : '—';
const kor = n => {
  if (!ok(n) || Math.abs(n) < 10000) return '';
  const neg = n < 0; n = Math.abs(Math.round(n));
  const eok = Math.floor(n / 1e8), man = Math.floor((n % 1e8) / 1e4), parts = [];
  if (eok) parts.push(fmtN(eok) + '억'); if (man) parts.push(fmtN(man) + '만');
  return (neg ? '-' : '') + parts.join(' ') + '원';
};
const wonK = n => { if (!ok(n)) return '—'; const k = kor(n); return k || won(n); };
const pct = (n, d = 1) => ok(n) ? (n * 100).toFixed(d) + '%' : '—';
const spct = (n, d = 1) => ok(n) ? (n > 0 ? '+' : '') + (n * 100).toFixed(d) + '%' : '—';
const swon = n => ok(n) ? (n > 0 ? '+' : '') + won(n) : '—';
const money = (n, cur) => cur === 'USD' ? (ok(n) ? '$' + fmtN(n, 2) : '—') : won(n);
const smoney = (n, cur) => ok(n) ? (n > 0 ? '+' : '') + money(n, cur) : '—';
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => ymd(new Date());
const pd = s => s ? new Date(s + 'T00:00:00') : null;
const days = (a, b) => (a && b) ? Math.round((pd(b) - pd(a)) / 864e5) : NaN;
const months = (a, b) => days(a, b) / 30.4375;
const dday = s => { const n = days(today(), s); return !ok(n) ? '' : n === 0 ? 'D-DAY' : n > 0 ? 'D-' + n : 'D+' + (-n); };
const tone = n => !ok(n) || n === 0 ? '' : n > 0 ? 'up' : 'down';
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pref = { get(k) { try { return localStorage.getItem('pj-' + k); } catch { return null; } }, set(k, v) { try { localStorage.setItem('pj-' + k, v); } catch {} } };

/* ---------- chick icons ---------- */
function chick(v = 'plain', size = 40) {
  const L = 'var(--chick-line)';
  let eyes = `<circle cx="25" cy="35" r="2.3" fill="${L}"/><circle cx="39" cy="35" r="2.3" fill="${L}"/>`;
  if (['sparkle', 'heart', 'coin', 'happy', 'flag'].includes(v)) eyes = `<path d="M22.5 36q2.5-3.2 5 0M36.5 36q2.5-3.2 5 0" stroke="${L}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  if (v === 'sleep') eyes = `<path d="M22.5 35.5h5M36.5 35.5h5" stroke="${L}" stroke-width="2.2" stroke-linecap="round"/>`;
  let acc = '';
  const star = (x, y, s = 1) => `<path transform="translate(${x} ${y}) scale(${s})" d="M0-8L2-2L8 0L2 2L0 8L-2 2L-8 0L-2-2Z" fill="#FFD84D" stroke="${L}" stroke-width="1.2" stroke-linejoin="round"/>`;
  switch (v) {
    case 'sparkle': acc = star(53, 12) + star(44, 5, .55); break;

function stockCalc(r, P = {}) {
  const cur = r.cur === '달러' ? 'USD' : 'KRW';
  const fx = cur === 'USD' ? num(r.fx) : 1;
  const buys = (r.buys || []).map(b => ({ d: b.date, p: num(b.price), q: num(b.qty) })).filter(b => ok(b.p) && ok(b.q) && b.q > 0);
  const sells = (r.sells || []).map(s => ({ d: s.date, p: num(s.price), q: num(s.qty), f: num(s.fee) || 0, why: s.why })).filter(s => ok(s.p) && ok(s.q) && s.q > 0);
  const qB = buys.reduce((a, b) => a + b.q, 0), cost = buys.reduce((a, b) => a + b.p * b.q, 0);
  const avg = qB ? cost / qB : NaN;
  const qS = sells.reduce((a, s) => a + s.q, 0);
  const proceeds = sells.reduce((a, s) => a + s.p * s.q, 0), fees = sells.reduce((a, s) => a + s.f, 0);
  const realized = qS ? proceeds - avg * qS - fees : NaN;
